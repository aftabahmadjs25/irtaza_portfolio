<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | Irtaza Khalid</title>
    <meta name="robots" content="noindex, follow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat+Brush&family=Inter+Tight:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/studio.css">
    <style>
        .not-found-stage {
            min-height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(ellipse 75% 60% at 50% 40%, rgba(19, 185, 253, 0.25) 0%, transparent 70%),
                linear-gradient(180deg, #052852 0%, #02569b 56%, #54c5f8 100%);
        }
        .not-found-card {
            max-width: 460px;
            width: 100%;
            text-align: center;
        }
        .not-found-code {
            font-family: var(--font-display);
            font-size: clamp(82px, 16vw, 128px);
            line-height: 0.95;
            color: var(--ink);
            margin-bottom: 10px;
        }
        .not-found-sub {
            font-size: 15.5px;
            color: var(--ink-muted);
            margin-bottom: 24px;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <main class="not-found-stage">
        <div class="ticket-card not-found-card">
            <span class="ticket-hole tl" aria-hidden="true"></span>
            <span class="ticket-hole tr" aria-hidden="true"></span>
            <span class="ticket-hole bl" aria-hidden="true"></span>
            <span class="ticket-hole br" aria-hidden="true"></span>
            <h1 class="not-found-code">404</h1>
            <p class="not-found-sub">Looks like this route doesn't exist. Let's get you back to the portfolio.</p>
            <a href="/" class="tag tag-accent">← Back to Portfolio</a>
        </div>
    </main>
</body>

</html>
